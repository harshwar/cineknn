services:
  - type: web
    name: barebone-hybrid-recommender
    runtime: python
    region: oregon
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
